version: 1
prose:
  enabled: false
review:
  forge: true
commands:
  rust-lint: cargo clippy --workspace --all-targets -- -D warnings
  rust-test: cargo test -p xiangqi-core -p jade-match-server
  rust-test-postgres: ./dev/test-postgres.sh
process:
  stages:
    - name: publish
      steps: [check, {verify: [rust-lint, rust-test, rust-test-postgres]}, submit, {ready: {wait: 30}}]
branches:
  pattern: "{user}/{type}/{scope}/{slug}"
  worktrees: .claude/worktrees
  stack: routed
